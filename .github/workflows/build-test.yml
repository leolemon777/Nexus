name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore Nexus.slnx

      - name: Build
        run: dotnet build Nexus.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Nexus.slnx --configuration Release --no-build -- xunit.parallelizeTestCollections=false

      - name: Pack Nexus.Modbus
        run: dotnet pack src\Nexus.Modbus --configuration Release --no-build --output artifacts\packages

      - name: Upload Nexus.Modbus package
        uses: actions/upload-artifact@v4
        with:
          name: nexus-modbus-nupkg
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
