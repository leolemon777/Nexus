name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test, and pack
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore Nexus.slnx

      - name: Build
        run: dotnet build Nexus.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Nexus.slnx --configuration Release --no-build -- xunit.parallelizeTestCollections=false

      # ── Pack all protocol libraries ──
      - name: Pack all Nexus protocol libraries
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path src\Nexus.*\*.csproj -Exclude *.App.csproj
          foreach ($proj in $projects) {
            # Skip Nexus.App (WPF app, not a library)
            if ($proj.FullName -match 'Nexus\.App\\') { continue }
            Write-Host "Packing $($proj.FullName)..."
            dotnet pack $proj.FullName --configuration Release --no-build --output artifacts\packages
          }

      - name: List packages
        shell: pwsh
        run: Get-ChildItem artifacts\packages\*.nupkg | ForEach-Object { Write-Host $_.Name }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nexus-nupkgs
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
