name: CI

on:
  push:
    branches: [master, 'fix/**', 'feature/**']
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # MinVer needs full history for versioning

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore Nexus.slnx

    - name: Build
      run: dotnet build Nexus.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test Nexus.slnx --no-build --configuration Release --verbosity normal
