name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Nexus.slnx

    - name: Build
      run: dotnet build Nexus.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test Nexus.slnx --no-build --configuration Release --verbosity normal

  pack-and-publish:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore
      run: dotnet restore Nexus.slnx

    - name: Pack all libraries
      shell: pwsh
      run: |
        $projects = Get-ChildItem -Path src -Filter "Nexus.*.csproj" -Recurse | Where-Object {
          $_.Name -ne "Nexus.App.csproj"
        }
        foreach ($proj in $projects) {
          Write-Host "Packing $($proj.FullName)..."
          dotnet pack $proj.FullName --configuration Release --output ./nupkgs --no-build
        }

    - name: Upload NuGet artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkgs/*.nupkg

    # Uncomment when ready to publish to nuget.org
