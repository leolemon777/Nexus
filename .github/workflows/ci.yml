name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Nexus.slnx

    - name: Build
      run: dotnet build Nexus.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test Nexus.slnx --no-build --configuration Release --verbosity normal

  pack:
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Nexus.slnx

    - name: Build
      run: dotnet build Nexus.slnx --no-restore --configuration Release

    - name: Pack libraries
      shell: pwsh
      run: |
        $projects = Get-ChildItem -Path src -Filter "Nexus.*.csproj" -Recurse | Where-Object {
          $_.Name -ne "Nexus.App.csproj"
        }
        foreach ($project in $projects) {
          dotnet pack $project.FullName --configuration Release --output ./nupkgs --no-build
        }

    - name: Upload NuGet artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkgs/*.nupkg
