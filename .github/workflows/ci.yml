name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore Nexus.slnx
    
    - name: Build
      run: dotnet build Nexus.slnx --no-restore --configuration Release
    
    - name: Test
      run: dotnet test Nexus.slnx --no-build --configuration Release --verbosity normal
    
    - name: Pack NuGet
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        dotnet pack src/Nexus.Core/Nexus.Core.csproj --configuration Release --output ./nupkgs
        dotnet pack src/Nexus.Modbus/Nexus.Modbus.csproj --configuration Release --output ./nupkgs
        dotnet pack src/Nexus.Siemens/Nexus.Siemens.csproj --configuration Release --output ./nupkgs
    
    - name: Upload NuGet artifacts
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkgs/*.nupkg
