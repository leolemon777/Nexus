[package]
name = "nexus-rust"
version = "0.1.0"
description = "Nexus 2.0 industrial protocol workbench"
authors = ["Nexus 2.0"]
edition = "2024"

[lib]
name = "nexus_rust_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serial2-tokio = "0.1.24"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

